<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Rithvik Nag — Software Engineer & Builder</title>

    <meta
      name="description"
      content="Rithvik Nag is a Software Engineer and Builder creating modern web products, digital experiences, and practical software solutions."
    />

    <meta
      name="author"
      content="Rithvik Nag"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="keywords"
      content="Rithvik Nag, Software Engineer, Frontend Engineer, React Developer, Full Stack Developer, Web Developer, Software Engineer India, Developer Portfolio"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0B0B0C"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Rithvik Nag — Software Engineer & Builder"
    />

    <meta
      property="og:description"
      content="Portfolio of Rithvik Nag — Software Engineer and Builder creating modern web products and digital experiences."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Rithvik Nag"
    />

    <meta
      property="og:image"
      content="/images/profile.jpg"
    />

    <meta
      property="og:image:alt"
      content="Rithvik Nag — Software Engineer"
    />

    <!-- LinkedIn -->
    <meta
      property="profile:first_name"
      content="Rithvik"
    />

    <meta
      property="profile:last_name"
      content="Nag"
    />

    <!-- Performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Application -->
    <meta
      name="application-name"
      content="Rithvik Nag Portfolio"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Rithvik Nag"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
